{% extends 'base.html' %}
{% block title %}Profile - LeaveFlow{% endblock %}
{% block content %}
<div class="container-fluid" style="max-width: 760px;">
    <h1 class="h3 mb-4">Profile settings</h1>
    <div class="card p-4 mb-4">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3"><label for="id_full_name" class="form-label">Full name</label>{{ form.full_name }}</div>
            <div class="mb-3"><label for="id_email" class="form-label">Email</label>{{ form.email }}</div>
            <div class="mb-3"><label for="id_phone" class="form-label">Phone</label>{{ form.phone }}</div>
            <div class="mb-3"><label for="id_department" class="form-label">Department</label>{{ form.department }}</div>
            <div class="mb-3"><label for="id_profile_picture" class="form-label">Photo</label>{{ form.profile_picture }}</div>
            <button type="submit" class="btn btn-primary">Save profile</button>
        </form>
    </div>
    <div class="card p-4">
        <h2 class="h5">Change password</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3"><label for="current_password" class="form-label">Current password</label><input class="form-control" type="password" id="current_password" name="current_password" required></div>
            <div class="mb-3"><label for="new_password" class="form-label">New password</label><input class="form-control" type="password" id="new_password" name="new_password" required></div>
            <div class="mb-3"><label for="confirm_password" class="form-label">Confirm password</label><input class="form-control" type="password" id="confirm_password" name="confirm_password" required></div>
            <button type="submit" class="btn btn-primary">Change password</button>
        </form>
    </div>
</div>
{% endblock %}
